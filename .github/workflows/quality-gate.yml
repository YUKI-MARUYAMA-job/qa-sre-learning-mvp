name: Quality Gate

on:
  push:
  pull_request:

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js (security baseline)
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.1

      - name: Verify Node.js security baseline
        run: |
          ACTUAL_NODE="$(node -p 'process.versions.node')"
          REQUIRED_NODE="24.22.1"
          if [[ "${ACTUAL_NODE}" != "${REQUIRED_NODE}" ]]; then
            echo "Expected Node.js ${REQUIRED_NODE}, got ${ACTUAL_NODE}"
            exit 1
          fi
          node --version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Run quality gate
        run: bun run check

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: quality-reports
          path: reports/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload app build
        if: ${{ success() }}
        uses: actions/upload-artifact@v7
        with:
          name: dist-app
          path: dist/app/
          if-no-files-found: error
          retention-days: 7
